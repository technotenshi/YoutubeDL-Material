name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets - gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: SAST - semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # Report-only until the baseline (about 80 findings) is triaged;
      # add --error to make findings fail the job.
      - name: Run semgrep
        run: >
          semgrep scan --metrics=off
          --config p/default --config p/javascript --config p/dockerfile
          --exclude node_modules --exclude backend/public --exclude src/assets/i18n
          backend src docker-utils Dockerfile

  trivy:
    name: Vulnerabilities and misconfig - trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          # Report-only until the baseline is triaged; set to '1' to enforce.
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
