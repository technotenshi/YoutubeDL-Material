version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps for the Node and Ubuntu base images are held until the
      # runtime decision in #18 is made. Remove these two entries when #18
      # closes. The current pins (Node 16.14.2, libicu74 on Ubuntu 24.04) do
      # not work with the newest majors. The runtime base moved to 24.04 for
      # Python 3.12 in #56; see docs/DECISIONS.md.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/backend/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      backend-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
