# Gitleaks configuration: extend the built-in ruleset.
# Used by CI (.github/workflows/security.yml) and .githooks/pre-commit.
title = "YoutubeDL-Material gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated or vendored content, not first-party secrets"
paths = [
  '''package-lock\.json$''',
  '''backend/public/''',
  '''node_modules/''',
  '''src/assets/i18n/messages\.[A-Za-z_-]+\.json$''',
]
# Upstream's fixed placeholder admin token (used when auth is disabled) and the
# Slack webhook example shown as input placeholder text.
regexes = [
  '''4241b401-7236-493e-92b5-b72696b9d853''',
  '''hooks\.slack\.com/services/T00000000/B00000000/X+''',
]
# Upstream 2020 commit that added a Chrome extension signing key; the file was
# later removed from the tree. Accepted as upstream history, not rotated here.
commits = ["695b836852a25ea31a5b20f09d35fa2826c02230"]
